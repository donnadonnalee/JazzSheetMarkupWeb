<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazz Sheet Markup | ABC Lead Sheet Viewer & Synthesizer</title>
    <meta name="description" content="Professional Jazz Lead Sheet renderer and playback synthesizer powered by ABC notation.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Noto+Music&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="light-theme">
    <!-- App Container -->
    <div class="app-layout">
        <!-- Top Navigation Bar -->
        <header class="top-nav">
            <div class="nav-left">
                <span class="logo-icon">🎷</span>
                <span class="brand-title">Jazz Sheet Markup</span>
                <span class="brand-tag">ABC Renderer & Synth</span>
            </div>
            <div class="nav-center">
                <!-- Forum Navigation Actions -->
                <div class="btn-group">
                    <button id="btnForum" class="btn btn-tool" style="background:#0284c7; border:1px solid #0369a1; font-weight:600;" title="オンライン楽譜フォーラムを開く">🌐 Forum</button>
                    <button id="btnShareForum" class="btn btn-tool" style="background:#0d9488; border:1px solid #0f766e;" title="現在の楽譜をフォーラムに投稿する">📤 Post Sheet</button>
                </div>
            </div>
            <div class="nav-right">
                <!-- Quick Transpose Buttons -->
                <div class="btn-group transpose-group">
                    <button id="btnTransposeDown" class="btn btn-tool" title="Transpose Down 1 Semitone">-1</button>
                    <span id="transposeDisplay" class="transpose-label">Orig</span>
                    <button id="btnTransposeUp" class="btn btn-tool" title="Transpose Up 1 Semitone">+1</button>
                    <button id="btnToggleL" class="btn btn-tool" title="Toggle L: 1/8 ⇔ L: 1/4">L: 1/8 ⇄ 1/4</button>
                </div>
                <!-- Fullscreen Session (Zen Mode) -->
                <button id="btnZenMode" class="btn btn-tool" style="background:#1b5e20; border:1px solid #2e7d32; font-weight:600;" title="全画面セッション表示 (ヘッダー・フッター非表示)">🖥️ Fullscreen</button>
                <!-- Editor Toggle -->
                <button id="btnToggleEditor" class="btn btn-tool" style="background:#2a3449; border:1px solid #3e4c68;" title="Toggle ABC Editor">📝 Editor</button>
                <!-- Theme Toggle -->
                <button id="btnThemeToggle" class="btn btn-icon" title="Toggle Dark/Light Mode">🌙</button>
            </div>
        </header>

        <!-- Main Workspace (Editor + Canvas) -->
        <main class="workspace">
            <!-- Left Panel: ABC Notation Editor -->
            <section class="editor-pane">
                <div class="pane-header">
                    <h3>ABC Notation</h3>
                    <div class="header-actions">
                        <button id="btnCopy" class="btn btn-xs">Copy</button>
                        <button id="btnClear" class="btn btn-xs btn-danger">Clear</button>
                    </div>
                </div>
                <!-- Multi-tune / Version Switching Tabs -->
                <div class="version-tab-bar" id="versionTabBar">
                    <div class="version-tabs-scroll" id="versionTabsContainer">
                        <!-- Injected dynamically: e.g. <button class="version-tab active">Trad</button> -->
                    </div>
                    <div class="version-tab-actions">
                        <button id="btnAddVersion" class="btn-add-version" title="Add new version / variation">+</button>
                    </div>
                </div>
                <div class="editor-wrapper">
                    <textarea id="abcInput" spellcheck="false" placeholder="Enter ABC notation here..."></textarea>
                </div>
            </section>

            <!-- Draggable Splitter Handle -->
            <div class="resizer" id="dragResizer" title="ドラッグして境界を移動 (左右にリサイズ)"></div>

            <!-- Right Panel: High-Resolution Sheet Music -->
            <section class="viewer-pane">
                <div class="pane-header">
                    <h3>Lead Sheet Preview</h3>
                    <div class="view-balance-controls">
                        <label for="viewBalanceSelect">View:</label>
                        <select id="viewBalanceSelect" class="styled-select-sm">
                            <option value="1">Chord Only</option>
                            <option value="2">Chord Focus</option>
                            <option value="3" selected>Balanced</option>
                            <option value="4">Melody Focus</option>
                            <option value="5">Melody Max</option>
                        </select>
                    </div>
                </div>
                <div class="canvas-scroll-container" id="canvasContainer">
                    <canvas id="sheetCanvas"></canvas>
                </div>
            </section>
        </main>

        <!-- Bottom Playback Control Bar -->
        <footer class="playback-bar">
            <!-- Playback Core Buttons -->
            <div class="play-actions">
                <button id="btnPlay" class="btn-playback btn-play" title="Play">▶</button>
                <button id="btnStop" class="btn-playback btn-stop" title="Stop">⏹</button>
                <button id="btnLoop" class="btn-toggle" title="Loop Playback">🔁 Loop</button>
            </div>

            <!-- Tempo (BPM) -->
            <div class="tempo-control">
                <label for="bpmSlider">BPM:</label>
                <input type="range" id="bpmSlider" min="40" max="280" value="120" class="styled-slider">
                <input type="number" id="bpmInput" min="40" max="280" value="120" class="bpm-number-input">
            </div>

            <!-- Rhythm Feel -->
            <div class="rhythm-control">
                <label>Feel:</label>
                <div class="segmented-control" id="rhythmFeelGroup">
                    <button data-feel="0" class="btn-segment active">Even</button>
                    <button data-feel="1" class="btn-segment">Swing</button>
                    <button data-feel="2" class="btn-segment">Shuffle</button>
                </div>
            </div>

            <!-- Volume Mixing -->
            <div class="mixer-control">
                <div class="vol-slider-wrap" title="Melody Volume">
                    <span class="vol-label">Mel</span>
                    <input type="range" id="volMelody" min="0" max="1" step="0.05" value="1.0" class="styled-slider-sm">
                </div>
                <div class="vol-slider-wrap" title="Chords Volume">
                    <span class="vol-label">Chd</span>
                    <input type="range" id="volChords" min="0" max="1" step="0.05" value="0.8" class="styled-slider-sm">
                </div>
                <div class="vol-slider-wrap" title="Bass Volume">
                    <span class="vol-label">Bas</span>
                    <input type="range" id="volBass" min="0" max="1" step="0.05" value="0.4" class="styled-slider-sm">
                </div>
            </div>

            <!-- Export -->
            <div class="export-actions">
                <button id="btnExportWav" class="btn btn-accent btn-sm" title="Export as lossless WAV audio">💾 WAV</button>
            </div>
        </footer>

        <!-- Floating Minimal Session Toolbar (Active in Fullscreen Zen Mode) -->
        <aside id="zenToolbar" class="zen-floating-bar" aria-label="Fullscreen Session Controls">
            <button id="zenBtnPlay" class="zen-btn zen-btn-play" title="Play / Pause">▶ Play</button>
            <button id="zenBtnStop" class="zen-btn" title="Stop">⏹</button>
            <div class="zen-divider"></div>
            <button id="zenBtnForum" class="zen-btn" title="Open Forum">🌐 Forum</button>
            <div class="zen-divider"></div>
            <div class="zen-btn-group">
                <button id="zenBtnTransposeDown" class="zen-btn zen-btn-sm" title="Transpose -1">-1</button>
                <span id="zenTransposeDisplay" class="zen-label">Orig</span>
                <button id="zenBtnTransposeUp" class="zen-btn zen-btn-sm" title="Transpose +1">+1</button>
            </div>
            <div class="zen-divider"></div>
            <select id="zenViewBalanceSelect" class="zen-select" title="View Balance">
                <option value="1">Chord Only</option>
                <option value="2">Chord Focus</option>
                <option value="3" selected>Balanced</option>
                <option value="4">Melody Focus</option>
                <option value="5">Melody Max</option>
            </select>
            <div class="zen-divider"></div>
            <button id="zenBtnExit" class="zen-btn zen-btn-exit" title="Exit Fullscreen (Esc)">✕ Exit</button>
        </aside>
    </div>

    <!-- Forum Modal -->
    <div id="forumModal" class="modal-overlay hidden">
        <div class="modal-card forum-modal-card">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <span class="modal-icon">🌐</span>
                    <h2>Sheet Music Forum</h2>
                </div>
                <button class="btn-close" id="btnCloseForum" title="Close">&times;</button>
            </div>
            <div class="forum-controls">
                <div class="forum-search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="forumSearch" placeholder="Search by song title or author..." class="styled-input">
                </div>
                <div class="forum-sort-group">
                    <button id="btnSortPopular" class="btn btn-sm btn-filter btn-active">🔥 Popular</button>
                    <button id="btnSortLatest" class="btn btn-sm btn-filter">⏱️ Latest</button>
                    <button id="btnOpenPostModal" class="btn btn-sm btn-accent" style="font-weight:600;">+ Post Current Sheet</button>
                </div>
            </div>
            <div id="forumLoading" class="loading-spinner hidden">
                <div class="spinner"></div>
                <span>Loading forum sheets...</span>
            </div>
            <div id="forumList" class="forum-list">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Post Sheet Modal -->
    <div id="postModal" class="modal-overlay hidden">
        <div class="modal-card modal-card-sm">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <span class="modal-icon">📤</span>
                    <h2>Post Sheet to Forum</h2>
                </div>
                <button class="btn-close" id="btnClosePost">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="postTitle">Song Title:</label>
                    <input type="text" id="postTitle" placeholder="e.g., Liminesence" class="styled-input">
                </div>
                <div class="form-group">
                    <label for="postAuthor">Author / Contributor Name:</label>
                    <input type="text" id="postAuthor" placeholder="e.g., Jazz Player" class="styled-input">
                </div>
                <p class="form-note">Current ABC notation in the editor will be shared with all users.</p>
                <div class="modal-actions">
                    <button id="btnSubmitPost" class="btn btn-primary" style="font-weight:600;">Post to Forum</button>
                    <button id="btnCancelPost" class="btn btn-tool">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="videoModal" class="modal-overlay hidden">
        <div class="modal-card modal-card-sm">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <span class="modal-icon">🎥</span>
                    <h2 id="videoModalTitle">YouTube Videos</h2>
                </div>
                <button class="btn-close" id="btnCloseVideo">&times;</button>
            </div>
            <div class="video-modal-controls">
                <button id="btnAddVideo" class="btn btn-primary btn-sm">+ Add YouTube Video</button>
            </div>
            <div id="videoList" class="video-list">
                <!-- Injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Application Scripts -->
    <script src="js/models.js?v=6"></script>
    <script src="js/multi-tune-helper.js?v=6"></script>
    <script src="js/parser.js?v=6"></script>
    <script src="js/abc-converter.js?v=6"></script>
    <script src="js/renderer.js?v=6"></script>
    <script src="js/firebase-config.js?v=6"></script>
    <script src="js/forum.js?v=6"></script>
    <script src="js/audio-player.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
